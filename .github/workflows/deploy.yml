# Web arayüzünü GitHub Pages'e yayınlar.
# İlk kullanım: repo Settings -> Pages -> Source: "GitHub Actions" seçilmeli.
name: Deploy Web

on:
  push:
    branches: [main, claude/nfl-stats-tracker-plan-0o2c52]
  # Veri iş akışları bittiğinde de yayınla. Bu satırlar olmadan Salı
  # güncellemesi siteye hiç yansımıyordu: GITHUB_TOKEN ile atılan push'lar
  # başka bir iş akışını tetiklemiyor (GitHub'ın sonsuz döngü koruması),
  # dolayısıyla "data: ..." commit'leri repoya girip yayında kalıyordu.
  workflow_run:
    workflows: ["Update NFL Stats", "Gameday Injuries"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Tetikleyen iş akışı düştüyse yayınlama; push/dispatch'te koşul geçersiz
    # olacağı için ilk şart onları serbest bırakıyor.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
