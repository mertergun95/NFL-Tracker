# nflverse'ten istatistikleri indirip web/public/data altına JSON olarak işler.
name: Update NFL Stats

on:
  schedule:
    # Her Salı 10:00 UTC — MNF bittikten ve nflverse gece güncellemesinden sonra
    - cron: "0 10 * * 2"
  push:
    # pipeline değişince mevcut sezonu yeniden işle (veri commit'leri tetiklemez)
    branches: [main, claude/nfl-stats-tracker-plan-0o2c52]
    paths: ["pipeline/**", ".github/workflows/update-stats.yml"]
  workflow_dispatch:
    inputs:
      mode:
        description: "backfill (geçmiş sezonlar) veya update (mevcut sezon)"
        type: choice
        options: [update, backfill]
        default: update
      seasons:
        description: "backfill için sezon aralığı, ör. 2021-2025"
        default: "2021-2025"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        run: |
          MODE="${{ github.event.inputs.mode || 'update' }}"
          if [ "$MODE" = "backfill" ]; then
            python run.py backfill --seasons "${{ github.event.inputs.seasons || '2021-2025' }}"
          else
            python run.py update
          fi

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "Veri değişikliği yok, commit atlanıyor"
          else
            git commit -m "data: istatistikleri güncelle ($(date -u +%Y-%m-%d))"
            git push
          fi
